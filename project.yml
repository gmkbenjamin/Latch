name: Latch
options:
  bundleIdPrefix: com.latch
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  DEAD_CODE_STRIPPING: YES
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  STRING_CATALOG_GENERATE_SYMBOLS: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  LatchMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes:
          - AppIcon.icns
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.latch.mac
      PRODUCT_NAME: Latch
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_LSUIElement: YES
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Latch uses your local network to receive unlock requests from your iPhone or iPad.
      CODE_SIGN_ENTITLEMENTS: Mac/Latch.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconFile: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Latch
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSLocalNetworkUsageDescription: Latch uses your local network to receive unlock requests from your iPhone or iPad.
        NSBluetoothAlwaysUsageDescription: Latch uses Bluetooth so your iPhone can unlock this Mac when nearby.
        NSBonjourServices:
          - _latch._tcp
    postBuildScripts:
      - name: Embed Full App Icon
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Mac/AppIcon.icns
        script: |
          set -euo pipefail
          DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/AppIcon.icns"
          mkdir -p "$(dirname "$DEST")"
          cp -f "${SRCROOT}/Mac/AppIcon.icns" "$DEST"

  LatchiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.latch.ios
      PRODUCT_NAME: Latch
      GENERATE_INFOPLIST_FILE: YES
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_KEY_CFBundleDisplayName: Latch
      INFOPLIST_KEY_NSFaceIDUsageDescription: Authenticate to unlock your Mac.
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Latch discovers your Mac on the local network.
      INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Latch uses Bluetooth to find and unlock your nearby Mac.
      INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown on your Mac.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGN_ENTITLEMENTS: iOS/Latch.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Latch
        NSFaceIDUsageDescription: Authenticate to unlock your Mac.
        NSLocalNetworkUsageDescription: Latch discovers your Mac on the local network.
        NSBluetoothAlwaysUsageDescription: Latch uses Bluetooth to find and unlock your nearby Mac.
        NSCameraUsageDescription: Scan the pairing QR code shown on your Mac.
        NSBonjourServices:
          - _latch._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  LatchMac:
    build:
      targets:
        LatchMac: all
    run:
      config: Debug
  LatchiOS:
    build:
      targets:
        LatchiOS: all
    run:
      config: Debug
